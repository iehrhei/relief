/* ---------- 纸 ---------- */

/* ---------- 图版：读到时才在纸上显影 ---------- */

function loadData(){

  var pb=(window.DecompressionStream?fetch("relief.bin.gz").then(function(r){if(!r.ok)throw 0;return new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();}).then(function(buf){return {packed:new Uint8Array(buf)};})
    :Promise.reject(0)).catch(function(){return fetch("relief.bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(buf){return {raw:new Int16Array(buf)};});})
    .catch(function(){if(!window.DecompressionStream)throw 0;return fetch("relief.b64.txt").then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){var bin=atob(t.trim()),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();}).then(function(buf){return {packed:new Uint8Array(buf)};});});
  return Promise.all([pj,pb]);}

function prep(meta,img){

  var L=[-.62,-.62,.48],Lz=L[2];
  embC=mk(NC,NR);sunC=mk(NC,NR);toneC=mk(NC,NR);
  var e1=embC.getContext("2d"),s1=sunC.getContext("2d"),t1=toneC.getContext("2d");
  var ie=e1.createImageData(NC,NR),is=s1.createImageData(NC,NR),it=t1.createImageData(NC,NR),de=ie.data,ds=is.data,dt=it.data;
  for(var r=0;r<NR;r++)for(var q=0;q<NC;q++){
    var i2=r*NC+q,a=q>0?q-1:q,b=q<NC-1?q+1:q,u=r>0?r-1:r,v=r<NR-1?r+1:r,k=i2*4;
    if(!SEA[i2]){de[k]=255;de[k+1]=253;de[k+2]=248;de[k+3]=55;ds[k+3]=0;dt[k+3]=0;continue;}
    // 素压：平滑后的起伏
    var gx=(ZS[r*NC+b]-ZS[r*NC+a])/(2*cellM)*ex,gy=(ZS[v*NC+q]-ZS[u*NC+q])/(2*cellM)*ex,nl=Math.sqrt(gx*gx+gy*gy+1);
    var hs=(-gx*L[0]-gy*L[1]+L[2])/nl,e=(hs-Lz)*2.2;
    if(e>0){de[k]=255;de[k+1]=253;de[k+2]=246;de[k+3]=Math.min(255,e*70);}else{de[k]=92;de[k+1]=80;de[k+2]=64;de[k+3]=Math.min(255,-e*34);}

    tt=Math.max(0,Math.min(1,tt));dt[k]=GRAPH[0];dt[k+1]=GRAPH[1];dt[k+2]=GRAPH[2];dt[k+3]=Math.round(188*Math.pow(tt,1.25));}

function blur(src,W,H,rad){var a=new Float32Array(src),b=new Float32Array(src.length);
  for(var pass=0;pass<3;pass++){
    for(var r=0;r<H;r++){var acc=0,o=r*W;for(var c=-rad;c<=rad;c++)acc+=a[o+Math.min(W-1,Math.max(0,c))];

  return a;}

/* ---------- 版面与海底的对位 ---------- */

  var p=document.querySelector("#s1 p").getBoundingClientRect();Y.colL=p.left;Y.colR=p.right;Y.end=document.documentElement.scrollHeight;}

function build(){
  measure();

  pctDirty=true;dirty=true;updateHud();}

/* ---------- 测绘 ---------- */
var SW0=.12,SW1=.88;
function paintRows(rA,rB,replay){
  var lo=Math.min(rA,rB),hi=Math.max(rA,rB),r1=rowAt(Y.s1),r2=rowAt(Y.s2);
  if(hi>r1&&lo<r2){var step=96/ppr,first=Math.ceil(Math.max(lo,r1)/step)*step;
    for(var r=first;r<=Math.min(hi,r2);r+=step){var rr=Math.round(r);if(singleLines.indexOf(rr)<0)singleLines.push(rr);}}
  var f0=Math.max(lo,r2),f1=hi;
  if(f1>f0){var c0=colAt(innerWidth*SW0),c1=colAt(innerWidth*SW1),g=mx.createLinearGradient(c0,0,c1,0);
    g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.1,"rgba(0,0,0,1)");g.addColorStop(.9,"rgba(0,0,0,1)");g.addColorStop(1,"rgba(0,0,0,0)");
    mx.fillStyle=g;mx.fillRect(c0,f0,c1-c0,Math.max(.6,f1-f0));}
  state.lo=state.lo<0?lo:Math.min(state.lo,lo);state.hi=Math.max(state.hi,hi);pctDirty=true;dirty=true;}
function revealAt(r,c){var rad=90/ppr,g=mx.createRadialGradient(c,r,0,c,r,rad);
  g.addColorStop(0,"rgba(0,0,0,.95)");g.addColorStop(.6,"rgba(0,0,0,.6)");g.addColorStop(1,"rgba(0,0,0,0)");
  mx.fillStyle=g;mx.beginPath();mx.arc(c,r,rad,0,6.2832);mx.fill();pctDirty=true;dirty=true;}
var rings=[];
document.addEventListener("click",function(e){
  if(!built||body.classList.contains("plain")||e.target.closest("a,button,.controls"))return;
  var docY=e.clientY+scrollY;if(docY<Y.s1)return;

  state.left--;var p={r:rowAt(docY),c:colAt(e.clientX)};state.pings.push(p);revealAt(p.r,p.c);ping(false);updateHud();save();});

/* ---------- 浮 ---------- */
var glyph=$("glyph");
function setGlyph(a){var dx=Math.cos(a),dy=Math.sin(a);
  glyph.style.textShadow=(-dx*1.2).toFixed(2)+"px "+(-dy*1.2).toFixed(2)+"px 0 rgba(255,253,247,.95),"+(dx*1.2).toFixed(2)+"px "+(dy*1.2).toFixed(2)+"px 1px rgba(92,80,64,.42),"+(dx*5).toFixed(2)+"px "+(dy*5).toFixed(2)+"px 12px rgba(92,80,64,.16)";}
setGlyph(-2.4);
window.addEventListener("pointermove",function(e){var r=glyph.getBoundingClientRect();if(r.bottom<-200||r.top>innerHeight+200)return;
  setGlyph(Math.atan2(r.top+r.height/2-e.clientY,r.left+r.width/2-e.clientX));},{passive:true});

/* ---------- 绘制海底 ---------- */
var sunAmt=0;
function ink(a){return "rgba("+GRAPH[0]+","+GRAPH[1]+","+GRAPH[2]+","+a+")";}
function renderSea(){
  var W=sea.width,Hh=sea.height,top=scrollY,vh=innerHeight,k=DPR;
  sx.setTransform(1,0,0,1,0,0);sx.clearRect(0,0,W,Hh);if(body.classList.contains("plain"))return;
  var rTop=rowAt(top),rH=vh/ppr,cL=colAt(0),cW=innerWidth/ppr;
  var startY=Math.max(0,(Math.max(Y.s1-200,docYAt(0)+10)-top))*k;if(startY>=Hh)return;
  sx.save();sx.beginPath();sx.rect(0,startY,W,Hh-startY);sx.clip();
  sx.imageSmoothingEnabled=true;sx.imageSmoothingQuality="high";

  if(sunAmt<.99){sx.globalAlpha=1-sunAmt;sx.drawImage(embC,cL,rTop,cW,rH,0,0,W,Hh);}
  if(sunAmt>.01){sx.globalAlpha=sunAmt;sx.drawImage(sunC,cL,rTop,cW,rH,0,0,W,Hh);}
  sx.globalAlpha=1;

    for(var c=Math.max(0,Math.floor(cL));c<Math.min(NC,cL+cW+1);c++){var z=Z[r*NC+c];if(z>=0){on=false;continue;}var py=(y0-(z+3000)*.012)*k,px=xAt(c)*k;
      if(on)sx.lineTo(px,py);else{sx.moveTo(px,py);on=true;}}sx.stroke();});
  // 4 陆地的海岸线：已知的部分，始终画着
  sx.save();var s=ppr*k;sx.setTransform(s,0,0,s,(axisX-axisCol*ppr)*k,(docYAt(0)-top)*k);sx.lineWidth=.8*k/s;sx.strokeStyle=ink(.62);sx.stroke(coastPath);sx.restore();
  // 5 阅读通道
  var l=(Y.colL-40)*k,rr=(Y.colR+40)*k,g=sx.createLinearGradient(l,0,rr,0),P="rgba("+PAPER.join(",");
  var la2=innerWidth>900?.8:.5;g.addColorStop(0,P+",0)");g.addColorStop(.07,P+","+la2+")");g.addColorStop(.93,P+","+la2+")");g.addColorStop(1,P+",0)");

  META.labels.forEach(function(lb){var y=(docYAt(lb.r)-top),x=xAt(lb.c);if(y<-20||y>vh+20||x<-10||x>innerWidth+10)return;
    if(docYAt(lb.r)<Y.s1-100)return;
    var vis=lb.land?1:maskAt(lb.r,lb.c);if(vis<.25)return;
    var tx=x+10,inLane=x>Y.colL-40&&x<Y.colR+40;if(inLane)tx=Y.colR+52;
    sx.globalAlpha=Math.min(1,vis*1.3);
    sx.fillStyle=ink(.85);sx.beginPath();sx.arc(x*k,y*k,(lb.land?1.4:1.8)*k,0,6.2832);lb.land?sx.fill():(sx.lineWidth=k*.8,sx.strokeStyle=ink(.8),sx.stroke());
    if(inLane){sx.strokeStyle=ink(.16);sx.lineWidth=k*.5;sx.beginPath();sx.moveTo((x+4)*k,y*k);sx.lineTo((tx-4)*k,y*k);sx.stroke();}
    sx.fillStyle=ink(.78);sx.textAlign="left";sx.fillText(EN?lb.en:lb.zh+"  "+lb.en,tx*k,(y-5)*k);
    sx.fillStyle=ink(.48);sx.fillText(lb.lat+(lb.land?"":"  "+Math.abs(lb.z).toLocaleString("en-US")+" m"),tx*k,(y+8)*k);});
  sx.globalAlpha=1;sx.restore();
  if(startY>0){var fg=sx.createLinearGradient(0,startY,0,startY+260*k);fg.addColorStop(0,"rgba(0,0,0,1)");fg.addColorStop(1,"rgba(0,0,0,0)");sx.globalCompositeOperation="destination-out";sx.fillStyle=fg;sx.fillRect(0,startY-1,W,260*k+1);sx.globalCompositeOperation="source-over";}}
var mcache={};
function maskAt(r,c){var key=r+"_"+c;try{var a=mx.getImageData(Math.round(c),Math.round(r),1,1).data[3]/255;return a;}catch(e){return 0;}}

/* ---------- 前景 ---------- */
var flakes=[];(function(){var n=RM?40:110;for(var i=0;i<n;i++)flakes.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.0,v:.006+Math.random()*.014,ph:Math.random()*6.28,a:.15+Math.random()*.3});})();
var snowAmt=0,maxYears=0;
function renderFx(now,dt){
  var W=fx.width,Hh=fx.height,k=DPR,vh=innerHeight,top=scrollY,beamDoc=top+vh*.55;fxx.clearRect(0,0,W,Hh);
  if(body.classList.contains("plain"))return;
  // 测深绳
  if(beamDoc<Y.s1+vh*.4){var x=(Y.colL-64)*k,ys=Math.max(0,(Y.leadAnchor-top))*k,ye=vh*.55*k,fade=1-smooth(Y.s1-vh*.1,Y.s1+vh*.4,beamDoc);
    if(ye>ys&&fade>0){fxx.strokeStyle=ink((.5*fade).toFixed(3));fxx.lineWidth=k*.8;fxx.beginPath();fxx.moveTo(x,ys);fxx.lineTo(x,ye);fxx.stroke();
      var target=Z?-Z[Math.max(0,Math.min(NR-1,Math.round(rowAt(Y.s1))))*NC+axisCol]:3000,depth=Math.max(0,Math.min(target,(beamDoc-Y.leadAnchor-vh*.55)/(Y.s1-Y.leadAnchor-vh*.2)*target));
      fxx.fillStyle=ink((.7*fade).toFixed(3));fxx.beginPath();fxx.arc(x,ye,2.2*k,0,6.2832);fxx.fill();
      fxx.font=(10*k)+"px 'IBM Plex Mono', monospace";fxx.fillStyle="rgba(124,118,108,"+fade.toFixed(3)+")";fxx.textAlign="right";fxx.textBaseline="alphabetic";
      fxx.fillText(Math.round(depth/10)*10+T.m,x-10*k,ye+4*k);
      for(var t=500;t<depth;t+=500){var ty=ye-(depth-t)/Math.max(1,target)*(ye-ys);fxx.fillRect(x-4*k,ty,8*k,k*.7);}}}
  // 声呐线
  if(beamDoc>Y.s1){var by=vh*.55*k,single=beamDoc<Y.s2,a=single?.55:.4,g=fxx.createLinearGradient(0,0,W,0);
    if(single){g.addColorStop(.0,ink(0));g.addColorStop(.5,ink(a));g.addColorStop(1,ink(0));}
    else{g.addColorStop(SW0-.02,ink(0));g.addColorStop(SW0+.08,ink(a));g.addColorStop(SW1-.08,ink(a));g.addColorStop(SW1+.02,ink(0));}
    fxx.fillStyle=g;fxx.fillRect(0,by,W,Math.max(1,k*.6));}
  rings=rings.filter(function(p){return now-p.t<2000;});
  rings.forEach(function(p){var q=(now-p.t)/2000;fxx.beginPath();fxx.arc(p.x,p.y,(10+q*(p.dry?60:150))*k,0,6.2832);fxx.strokeStyle=ink(((1-q)*(1-q)*(p.dry?.3:.6)).toFixed(3));fxx.lineWidth=k*.8;fxx.stroke();});
  var r5=$("s5").getBoundingClientRect(),snowT=(r5.top<vh*.7&&r5.bottom>vh*.3)?1:0;snowAmt+=(snowT-snowAmt)*.03;
  if(snowAmt>.01)flakes.forEach(function(f){if(!RM){f.y+=f.v*dt;f.x+=Math.sin(now/2600+f.ph)*.00006;if(f.y>1.02){f.y=-.02;f.x=Math.random();}}
    fxx.beginPath();fxx.arc(f.x*W,f.y*Hh,f.r*k,0,6.2832);fxx.fillStyle=ink((f.a*snowAmt*.6).toFixed(3));fxx.fill();});}
function smooth(e0,e1,x){var t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);}

/* ---------- 读数、记忆 ---------- */
var mark=$("mark"),secs=[].slice.call(document.querySelectorAll("section[data-n]"));
function computePct(){
  if(!built)return;var r0=Math.max(0,Math.floor(rowAt(Y.s1))),r1=Math.min(NR,Math.ceil(rowAt(Y.end))),c0=Math.max(0,Math.floor(colAt(0))),c1=Math.min(NC,Math.ceil(colAt(innerWidth)));
  var d=mx.getImageData(c0,r0,c1-c0,r1-r0).data,w=c1-c0,tot=0,got=0;
  for(var r=r0;r<r1;r++)for(var c=c0;c<c1;c++){if(!SEA[r*NC+c])continue;tot++;got+=d[((r-r0)*w+(c-c0))*4+3]/255;}
  pctVal=tot?got/tot*100:0;pctDirty=false;}
function fmtLat(la){var a=Math.abs(la),deg=Math.floor(a),mn=Math.round((a-deg)*60);if(mn===60){deg++;mn=0;}return (la>=0?T.N:T.S)+deg+"°"+(mn<10?"0":"")+mn+"′"+(la>=0?T.nSuf:T.sSuf);}
function updateHud(){
  var p=pctVal.toFixed(1)+"%";$("hudPct").textContent=p;$("livePct").textContent=p;$("hudPings").textContent=state.left;
  var d=new Date();$("ovCap").textContent=T.ov(d,p);
  if(built){var beam=scrollY+innerHeight*.55,r=Math.round(rowAt(beam));
    if(beam>Y.s1&&r>=0&&r<NR){var la=META.latTop-r*META.dRow,z=Z[r*NC+axisCol];$("hudPos").textContent=fmtLat(la)+T.center+(z<0?T.depth(Math.round(-z)):T.land);}
    else $("hudPos").textContent="";}}
var KEY="relief-track-v2",saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}},500);}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.lo==="number"){state.lo=s.lo;state.hi=s.hi;state.pings=s.pings||[];state.left=typeof s.left==="number"?s.left:12;}}catch(e){}}
$("clearTrack").addEventListener("click",function(e){e.stopPropagation();try{localStorage.removeItem(KEY);}catch(err){}state={lo:-1,hi:-1,pings:[],left:12};lastBeam=null;if(ready){build();onScroll();}});

/* ---------- 结尾：你的航迹 ---------- */
var ov=$("overview"),ox=ov.getContext("2d"),ovLast=0;
function drawOverview(){
  if(!built)return;var W=ov.width,Hh=ov.height,cols=3,gap=36,cw=(W-gap*(cols-1))/cols;
  var r0=Math.max(0,Math.floor(rowAt(Y.s1))),span=(NR-r0)/cols,md=mx.getImageData(0,0,NC,NR).data;
  var sy=Hh/span,sxl=sy,cvis=cw/sxl,c0=Math.max(0,Math.round(axisCol-cvis*.62));
  ox.clearRect(0,0,W,Hh);
  for(var k=0;k<cols;k++){var left=k*(cw+gap),ra=r0+k*span;
    ox.save();ox.beginPath();ox.rect(left,0,cw,Hh);ox.clip();
    ox.globalAlpha=.55;ox.drawImage(embC,c0,ra,cvis,span,left,0,cw,Hh);ox.globalAlpha=1;
    var st=Math.max(3,Math.round(span/95));
    for(var r=Math.floor(ra);r<ra+span&&r<NR;r+=st){var yb=(r-ra)*sy;ox.beginPath();var on=false;
      for(var c=c0;c<c0+cvis&&c<NC;c++){var i=r*NC+c,m=md[i*4+3]/255,z=Z[i];
        if(m>.3&&z<0){var px=left+(c-c0)*sxl,py=yb-(z+3000)*.0038;if(on)ox.lineTo(px,py);else{ox.moveTo(px,py);on=true;}}else on=false;}
      ox.strokeStyle=ink(.62);ox.lineWidth=.6;ox.stroke();}
    singleLines.forEach(function(r){if(r<ra||r>=ra+span)return;var yb=(r-ra)*sy;ox.beginPath();var on=false;for(var c=c0;c<c0+cvis&&c<NC;c++){var z=Z[r*NC+c];if(z>=0){on=false;continue;}var px=left+(c-c0)*sxl,py=yb-(z+3000)*.003;if(on)ox.lineTo(px,py);else{ox.moveTo(px,py);on=true;}}ox.strokeStyle=ink(.8);ox.lineWidth=.8;ox.stroke();});
    ox.setTransform(sxl,0,0,sy,left-c0*sxl,-ra*sy);ox.lineWidth=.7/sxl;ox.strokeStyle=ink(.7);ox.stroke(coastPath);ox.setTransform(1,0,0,1,0,0);
    ox.restore();
    ox.font="13px 'IBM Plex Mono', monospace";ox.fillStyle="rgba(124,118,108,.9)";ox.textAlign="left";
    ox.fillText(fmtLat(META.latTop-ra*META.dRow),left,Hh-8);}
  if(BOUVET){var kb=2,rb=BOUVET.r-(r0+kb*span),xb=kb*(cw+gap)+(BOUVET.c-c0)*sxl,yb2=rb*sy;ox.fillStyle=ink(.9);ox.beginPath();ox.arc(xb,yb2,3,0,6.2832);ox.fill();
    ox.font="13px 'IBM Plex Mono', monospace";ox.textAlign="right";ox.fillText(T.bouvet,xb-8,yb2+4);}}

/* ---------- 滚动与循环 ---------- */
var lastBeam=null;
function onScroll(){
  if(!built)return;var vh=innerHeight,beam=scrollY+vh*.55;
  if(lastBeam===null)lastBeam=beam;if(beam>Y.s1||lastBeam>Y.s1)paintRows(rowAt(Math.max(Y.s1,lastBeam)),rowAt(Math.max(Y.s1,beam)),false);lastBeam=beam;
  var cur=null;secs.forEach(function(s){if(s.getBoundingClientRect().top<vh*.45)cur=s;});
  mark.innerHTML=(cur?cur.dataset.n:"·")+"<small>"+(cur?cur.dataset.depth:T.surface)+"</small>";$("hudDepth").textContent=cur?cur.dataset.depth:T.surface;
  var r5=$("s5").getBoundingClientRect(),read=Math.max(0,vh*.6-r5.top),yrs=Math.round(read/vh*1000/10)*10;
  if(yrs>maxYears&&r5.bottom>0){maxYears=yrs;$("yrs").textContent=maxYears.toLocaleString("zh-CN");$("mm").textContent=(maxYears/1000*3).toFixed(1);}
  updateHud();save();dirty=true;}
var ticking=false;window.addEventListener("scroll",function(){if(!ticking){ticking=true;requestAnimationFrame(function(){ticking=false;onScroll();});}},{passive:true});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){if(!ready)return;lastBeam=null;build();onScroll();},250);});

var last=performance.now(),pctT=0;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(built){var beamDoc=scrollY+innerHeight*.55,sunT=(beamDoc>Y.s3&&beamDoc<Y.nosun)?1:0,ns=RM?sunT:sunAmt+(sunT-sunAmt)*.02;
    if(Math.abs(ns-sunAmt)>.002){sunAmt=ns;dirty=true;}else sunAmt=ns;
    if(dirty){dirty=false;renderSea();}
    renderFx(now,dt);
    if(pctDirty&&now-pctT>900){pctT=now;computePct();updateHud();}
    if(now-ovLast>1500){var rr=ov.getBoundingClientRect();if(rr.top<innerHeight&&rr.bottom>0){drawOverview();ovLast=now;}}}
  requestAnimationFrame(frame);}

var lastH=0;
function watchHeight(){if(!ready)return;var h=document.documentElement.scrollHeight;if(Math.abs(h-lastH)>2){lastH=h;lastBeam=null;build();onScroll();}}
if(window.ResizeObserver)new ResizeObserver(function(){clearTimeout(rz);rz=setTimeout(watchHeight,200);}).observe(document.body);
window.addEventListener("load",function(){setTimeout(watchHeight,100);});
function start(){
  load();requestAnimationFrame(frame);
  loadData().then(function(res){prep(res[0],res[1]);ready=true;lastH=document.documentElement.scrollHeight;build();lastBeam=null;onScroll();$("loadnote").classList.add("done");})
  .catch(function(){$("loadnote").textContent=T.fail;body.classList.add("plain");});}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setTimeout(start,60);});else window.addEventListener("load",start);
})();
</script>
